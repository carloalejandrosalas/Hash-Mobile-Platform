services:
  mysql:
    image: mysql:8.4
    container_name: hashmobile-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the repository root .env file}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in the repository root .env file}
      MYSQL_USER: ${DB_USER:?Set DB_USER in the repository root .env file}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the repository root .env file}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
