info:
  name: POST /restore-password - Restores the password by using a token
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/auth/restore-password"
  body:
    type: json
    data: |-
      {
        "token": "0zWJg1U6KVXpeSm",
        "newPassword": "Pass123!",
        "confirmPassword": "Pass123!"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        // Parse the response body
        let data = res.getBody();

        if (data.token) {
          // Set the jwt token into the environment variable
          bru.setEnvVar("jwt_token", data.token) 
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
