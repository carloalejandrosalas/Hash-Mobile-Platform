info:
  name: POST /reset-password - Generates the restore password link
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "email": "x@localhost.com"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        // Parse the response body
        let data = res.getBody();

        if (data.token) {
          // Set the jwt token into the environment variable
          bru.setEnvVar("jwt_token", data.token) 
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
