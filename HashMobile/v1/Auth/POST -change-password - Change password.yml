info:
  name: POST /change-password - Change password
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "Pass123!",
        "newPassword": "Pass123!",
        "confirmPassword": "Pass123!"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // Parse the response body
        let data = res.getBody();

        if (data.token) {
          // Set the jwt token into the environment variable
          bru.setEnvVar("jwt_token", data.token) 
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
