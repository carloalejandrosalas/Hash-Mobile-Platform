  /auth/change-password:
    post:
      summary: POST /change-password - Change password
      deprecated: false
      description: >-
        Allows to change the authenticated user's password by providing the
        current password and the new password, and confirmation. If the user
        does not know the password, then the reset-password endpoint should be
        used.
      tags:
        - auth
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  description: The current authenticated user's password
                  x-apidog-mock: '{{$internet.password}}'
                newPassword:
                  type: string
                  description: The new password
                  x-apidog-mock: '{{$internet.password}}'
                confirmPassword:
                  type: string
                  description: The confirmation of the new password
                  x-apidog-mock: '{{$internet.password}}'
              x-apidog-orders:
                - currentPassword
                - newPassword
                - confirmPassword
              required:
                - currentPassword
                - newPassword
                - confirmPassword
              x-apidog-ignore-properties: []
            examples:
              '1':
                value:
                  currentPassword: current-password
                  newPassword: new-password
                  confirmPassword: new-password
                summary: Valid request
                description: >-
                  The current password matches, and new and confirm password
                  match as well.
              '2':
                value:
                  currentPassword: invalid-password
                  newPassword: new-password
                  confirmPassword: new-password
                summary: Invalid current password
                description: The current password is invalid
              '3':
                value:
                  currentPassword: current-password
                  newPassword: new-password
                  confirmPassword: another-password
                summary: Invalid confirm password
                description: The new and confirm passwords mismatch.
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    x-apidog-mock: '200'
                    description: HTTP response code
                  message:
                    type: string
                    x-apidog-mock: Password changed successfully
                    description: >-
                      Feedback message. Useful information about error messages
                      if applies.
                  data:
                    type: object
                    properties: {}
                    x-apidog-orders: []
                    description: The main attribute that contains the response data.
                    x-apidog-ignore-properties: []
                x-apidog-orders:
                  - code
                  - message
                  - data
                required:
                  - code
                  - message
                  - data
                x-apidog-ignore-properties: []
              example:
                code: 200
                message: Password changed successfully
                data: {}
          headers: {}
          x-apidog-name: Password changed successfully
          x-apidog-ordering: 0
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP code
                    x-apidog-mock: '400'
                  message:
                    type: string
                    x-apidog-mock: The provided password is invalid
                    description: Error message
                required:
                  - code
                  - message
                x-apidog-orders:
                  - code
                  - message
                x-apidog-ignore-properties: []
          headers: {}
          x-apidog-name: Invalid password
          x-apidog-ordering: 1
        '500':
          $ref: '#/components/responses/500 - Internal Server Error'
          description: Component response for Internal server errors
          x-apidog-ordering: 3
        x-apidog-additional-responses:
          - statusCode: 400
            description: ''
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    code:
                      type: integer
                      x-apidog-mock: '400'
                    message:
                      type: string
                      x-apidog-mock: The provided passwords do not match
                  required:
                    - code
                    - message
                  x-apidog-orders:
                    - code
                    - message
                  x-apidog-ignore-properties: []
            headers: {}
            x-apidog-name: Passwords do not match
            x-apidog-ordering: 2
