  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh the access token
      operationId: refreshAccessToken
      description: Rotates the refresh-token cookie and issues a new short-lived access token.
      security:
        - refresh-token-cookie: []
      responses:
        '200':
          description: Access token refreshed; a rotated refresh token is set in the cookie.
          headers:
            Set-Cookie:
              description: Rotated HttpOnly refresh-token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/401 - Unautharized access'
        '500':
          $ref: '#/components/responses/500 - Internal Server Error'
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the refresh token
      operationId: revokeRefreshToken
      security:
        - refresh-token-cookie: []
      responses:
        '204':
          description: Refresh token revoked and cookie cleared.
          headers:
            Set-Cookie:
              description: Expired refresh-token cookie.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/401 - Unautharized access'
